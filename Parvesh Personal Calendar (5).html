<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Parvesh Personal Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: violet banner with a sun-yellow date sticker. Left: stats, report card, calendar + day editor, submitted list.
   Right sidebar: custom date range report. Six rotating category colors. A coral pen cross marks every submitted day. */
:root {
  --bg: #f1eeff;
  --surface: #ffffff;
  --ink: #1d1340;
  --ink-2: #5a5080;
  --line: #d9d2f5;
  --accent: #5b2fe0;
  --accent-ink: #ffffff;
  --hero-bg: #5b2fe0;
  --hero-fg: #ffffff;
  --sun: #ffb800;
  --on-sun: #1d1340;
  --cross: #ff3d68;
  --good: #00875f;
  --warn: #b26a00;
  --bad: #e0264a;
  --junk: #d2560c;
  --c0: #5b2fe0; --c1: #ff3d68; --c2: #ffb800; --c3: #00b386; --c4: #1a9bf0; --c5: #ff7a1a;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #140e2e; --surface: #1f1748; --ink: #f4f0ff; --ink-2: #a79fcf; --line: #34296b;
    --accent: #a58bff; --accent-ink: #140e2e; --hero-bg: #2e2170; --hero-fg: #f4f0ff;
    --sun: #ffc83d; --on-sun: #1d1340; --cross: #ff7c93;
    --good: #2ed9a8; --warn: #ffc83d; --bad: #ff7c93; --junk: #ff9a4d;
    --c0: #a58bff; --c1: #ff7c93; --c2: #ffc83d; --c3: #2ed9a8; --c4: #4db6ff; --c5: #ff9a4d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #140e2e; --surface: #1f1748; --ink: #f4f0ff; --ink-2: #a79fcf; --line: #34296b;
  --accent: #a58bff; --accent-ink: #140e2e; --hero-bg: #2e2170; --hero-fg: #f4f0ff;
  --sun: #ffc83d; --on-sun: #1d1340; --cross: #ff7c93;
  --good: #2ed9a8; --warn: #ffc83d; --bad: #ff7c93; --junk: #ff9a4d;
  --c0: #a58bff; --c1: #ff7c93; --c2: #ffc83d; --c3: #2ed9a8; --c4: #4db6ff; --c5: #ff9a4d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 48px; }
.wrap { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.hero { background: var(--hero-bg); color: var(--hero-fg); border-radius: 16px; padding: 22px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
.hero .eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; margin: 0 0 6px; }
h1 { font-size: clamp(30px, 7vw, 46px); font-weight: 800; line-height: 1.02; }
.hero .sub { margin: 8px 0 0; max-width: 44ch; opacity: 0.92; }
.sticker { background: var(--sun); color: var(--on-sun); width: 84px; height: 84px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-5deg); flex: none; }
.sticker b { font-family: var(--f-display); font-size: 36px; line-height: 1; font-weight: 800; }
.sticker span { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.store { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); margin-top: -12px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
@media (max-width: 1020px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.content { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); margin-top: 0; min-width: 0; }
@media (max-width: 1020px) { .side { position: static; } }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: 12px; border-top: 5px solid var(--tile); padding: 12px 16px 14px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-2); font-size: 13px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "cal editor" "notes editor"; grid-template-rows: auto 1fr; gap: 24px; align-items: start; }
.main > .calpanel { grid-area: cal; }
.main > .editor { grid-area: editor; }
.main > .notespanel { grid-area: notes; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "cal" "editor" "notes"; grid-template-rows: auto; } }
.notespanel { display: flex; flex-direction: column; gap: 14px; }

.panel { background: var(--surface); border-radius: 16px; padding: 18px; min-width: 0; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.cal-head h2 { font-size: 22px; font-weight: 600; }
.cal-head h3 { font-size: 16px; font-weight: 600; }
.nav { display: flex; gap: 6px; }
.nav button { width: 40px; height: 40px; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; cursor: pointer; font-size: 20px; line-height: 1; }
.nav button:hover { filter: brightness(1.1); }
.nav button:disabled { opacity: 0.3; cursor: default; }
.cal-head.small .nav button { width: 28px; height: 28px; font-size: 16px; border-radius: 7px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 2px 2px; }
.blank { aspect-ratio: 1 / 1; max-width: 100%; }
.cell { position: relative; aspect-ratio: 1 / 1; max-width: 100%; min-width: 0; padding: 4px 5px; border: 2px solid transparent; background: var(--bg); border-radius: 8px; cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.cell:hover:not(:disabled) { border-color: var(--accent); }
.cell.today { background: var(--sun); color: var(--on-sun); }
.cell.today .num { font-weight: 600; }
.cell.sel { border-color: var(--accent); }
.cell.future { cursor: default; background: transparent; border: 1px dashed var(--line); color: var(--ink-2); opacity: 0.7; }
.num { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 4px; font-family: var(--f-mono); font-size: 10px; font-weight: 500; line-height: 1; }
.tags .w-done, .tags .j-clean { color: var(--good); }
.tags .w-partly { color: var(--warn); }
.tags .w-missed { color: var(--bad); }
.tags .j-had { color: var(--junk); }
.tags .none { color: var(--line); }
.cell.today .tags .none { color: rgba(29, 19, 64, 0.35); }
.cell.today .tags .w-done, .cell.today .tags .j-clean { color: #006b4b; }
.cell.today .tags .w-partly { color: #6b3f00; }
.cell.today .tags .w-missed { color: #b0102f; }
.cell.today .tags .j-had { color: #a63e00; }
.cross { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cross path { fill: none; stroke: var(--cross); stroke-width: 4; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.cross.fresh path { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 0.35s ease-out forwards; }
.cross.fresh path + path { animation-delay: 0.2s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .cross.fresh path { animation: none; stroke-dashoffset: 0; } }
.legend { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); }
.legend code { font-family: var(--f-mono); font-weight: 500; }

.editor { display: flex; flex-direction: column; gap: 18px; }
.editor h2 { font-size: 24px; font-weight: 800; }
.when { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); margin: 2px 0 0; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
legend, label.lbl { font-weight: 600; font-size: 14px; padding: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; padding: 8px 14px; border: 2px solid var(--line); border-radius: 99px; background: var(--bg); font-size: 14px; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 2px; }
textarea, input.name { width: 100%; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); line-height: 1.45; }
textarea { min-height: 72px; resize: vertical; }
textarea:focus, input.name:focus { border-color: var(--accent); outline: none; }
textarea::placeholder { color: var(--ink-2); opacity: 0.8; }
.hint { font-size: 12px; color: var(--ink-2); margin: 0; }

.cats-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.cats-head h3 { font-size: 16px; font-weight: 600; }
.cats-head .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.cat { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px 8px; border-radius: 8px; background: var(--bg); border-left: 4px solid var(--cc); min-width: 0; }
.cat .t { font-weight: 600; font-size: 12px; line-height: 1.2; overflow-wrap: anywhere; }
.cat textarea { background: var(--surface); min-height: 36px; padding: 5px 8px; font-size: 13px; line-height: 1.35; border-width: 1px; border-radius: 6px; }
.cat input.name { background: var(--surface); font-weight: 600; font-size: 12px; padding: 4px 8px; border-width: 1px; border-radius: 6px; min-width: 0; }
.cat .manage { display: flex; gap: 4px; align-items: center; }
.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }

textarea.notes12 { min-height: calc(12 * 26px + 20px); }
textarea.notes6 { min-height: calc(6 * 26px + 20px); }
textarea.notes6.max { min-height: calc(16 * 26px + 20px); }
textarea.ruled { line-height: 26px; padding: 10px 12px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 25px, var(--line) 25px, var(--line) 26px); background-attachment: local; background-position-y: 10px; background-repeat: repeat; }
.qnotes { display: flex; flex-direction: column; gap: 8px; }
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.qhead h3 { font-size: 16px; font-weight: 600; }
.qhead .btns { display: flex; gap: 6px; }
.notes-wrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.notes-wrap > div { width: 100%; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.del { color: var(--bad); padding: 3px 8px; font-size: 12px; flex: none; }
.btn.del.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: default; }
.msg { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); min-height: 18px; }
.msg.err { color: var(--bad); }

.report { background: var(--surface); border-radius: 16px; padding: 18px 20px 20px; }
.report-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 14px; }
.report-head h2 { font-size: 22px; font-weight: 800; }
.report-head p { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.marks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px 32px; }
.mark { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.mark .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mark .name { font-weight: 600; }
.mark .pct { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.mark .pct small { font-size: 22px; }
.grade { font-family: var(--f-display); font-weight: 800; font-size: 20px; min-width: 52px; text-align: center; padding: 6px 12px; border-radius: 10px; background: var(--gc); color: var(--on-sun); }
.bar { height: 14px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--bc); }
.mark .detail { font-size: 13px; color: var(--ink-2); }
.report .none { color: var(--ink-2); margin: 0; }

.dl { margin-top: 18px; padding-top: 16px; border-top: 2px dashed var(--line); display: flex; flex-direction: column; gap: 10px; }
.dlbox { position: relative; display: inline-block; align-self: flex-start; max-width: 100%; }
.dlmain { background: var(--accent); border: 2px solid var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
.dlmain:hover { filter: brightness(1.08); }
.menu { position: absolute; z-index: 20; left: 0; top: calc(100% + 6px); width: min(310px, calc(100vw - 64px)); background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 6px; box-shadow: 0 10px 28px rgba(29, 19, 64, 0.22); display: flex; flex-direction: column; gap: 2px; }
.menu.wide { width: min(320px, calc(100vw - 64px)); padding: 12px; gap: 10px; }
.menu .mi { display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; width: 100%; padding: 8px 12px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; }
.menu .mi:hover, .menu .mi:focus-visible { background: var(--bg); }
.menu .mi b { font-weight: 600; font-size: 14px; }
.menu .mi span { font-size: 12px; color: var(--ink-2); }
.menuhead { display: flex; align-items: center; gap: 10px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; width: calc(100% - 12px); }
.menu .mi.alt b { color: var(--accent); }

.sidepanel { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border-top: 5px solid var(--c2); }
.sidepanel h2 { font-size: 17px; font-weight: 800; }
.picker { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.picker .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.picker .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.picker input.name { padding: 5px 6px; font-size: 12px; border-width: 1px; border-radius: 8px; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.mdow { font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); text-align: center; text-transform: uppercase; }
.mc { position: relative; height: 28px; border: 0; border-radius: 6px; background: transparent; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; padding: 0; }
.mc:hover:not(:disabled) { background: var(--bg); }
.mc.fut { opacity: 0.3; cursor: default; }
.mc.has::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--cross); }
.mc.in { background: color-mix(in srgb, var(--accent) 24%, var(--surface)); border-radius: 0; }
.mc.edge { background: var(--accent); color: var(--accent-ink); border-radius: 6px; }
.mc.edge.has::after { background: var(--accent-ink); }
.mc.in:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 24%, var(--surface)); }
.mc.edge:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 99px; padding: 3px 9px; font-size: 11px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.sum { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); min-height: 16px; }
.picker .btn.primary { width: 100%; padding: 8px 12px; font-size: 14px; }
.picker .hint { font-size: 11px; }

.log h2 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.entries { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.entry { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 18px; padding: 14px 16px; background: var(--surface); border-radius: 12px; cursor: pointer; }
.entry:hover { box-shadow: 0 0 0 2px var(--accent); }
@media (max-width: 560px) { .entry { grid-template-columns: minmax(0, 1fr); } }
.entry .d { font-family: var(--f-mono); font-size: 13px; }
.entry .body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-family: var(--f-mono); font-size: 12px; padding: 2px 10px; border: 1.5px solid currentColor; border-radius: 99px; }
.badge.good { color: var(--good); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); } .badge.junk { color: var(--junk); }
.item { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 10px; border-left: 4px solid var(--cc); }
.item small { display: block; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.empty { color: var(--ink-2); padding: 14px 16px; background: var(--surface); border-radius: 12px; }
</style>

<div class="wrap">
  <header class="hero">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1>Parvesh Personal Calendar</h1>
      <p class="sub">Log the day, write what you got done, submit it and cross it out.</p>
    </div>
    <div class="sticker" aria-hidden="true"><b id="stDay"></b><span id="stMon"></span></div>
  </header>
  <div class="store" id="store" aria-live="polite"></div>

  <div class="layout">
    <div class="content">
      <section class="stats" id="stats" aria-label="This month"></section>

      <section class="report" id="report" aria-label="Report card"></section>

      <div class="main">
        <section class="panel calpanel" aria-label="Calendar">
          <div class="cal-head">
            <h2 id="monthTitle"></h2>
            <div class="nav">
              <button type="button" id="prev" aria-label="Previous month">&#8249;</button>
              <button type="button" id="next" aria-label="Next month">&#8250;</button>
            </div>
          </div>
          <div class="grid" id="grid"></div>
          <div class="legend">
            <span><code style="color:var(--good)">W</code> work done</span>
            <span><code style="color:var(--warn)">W</code> partly</span>
            <span><code style="color:var(--bad)">W</code> not done</span>
            <span><code style="color:var(--good)">J</code> no junk</span>
            <span><code style="color:var(--junk)">J</code> had junk</span>
          </div>
        </section>

        <form class="panel editor" id="editor" autocomplete="off"></form>
        <section class="panel notespanel" id="notesPanel" aria-label="Notes"></section>
      </div>

      <section class="log">
        <h2 id="logTitle">Submitted days</h2>
        <div class="entries" id="entries"></div>
      </section>
    </div>

    <aside class="side" aria-label="Custom report">
      <div class="sidepanel" id="side" tabindex="-1"></div>
    </aside>
  </div>
</div>

<script>
(function () {
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var keyOf = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var parseKey = function (k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); };
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var todayKey = keyOf(today);
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

        h("button", { type: "button", "data-crnav": "-1", "aria-label": "Previous month", text: "‹" }),
        h("button", { type: "button", "data-crnav": "1", "aria-label": "Next month", disabled: atNow, text: "›" })
      ])
    ]));
    var g = h("div", { class: "mgrid" });
    ["M", "T", "W", "T", "F", "S", "S"].forEach(function (n) { g.appendChild(h("div", { class: "mdow", text: n })); });
    var off = (new Date(y, m, 1).getDay() + 6) % 7;
    for (var i = 0; i < off; i++) g.appendChild(h("div"));
    var cnt = new Date(y, m + 1, 0).getDate(), lo = cr.a, hi = cr.b || cr.a;
    for (var n = 1; n <= cnt; n++) {
      var d = new Date(y, m, n), k = keyOf(d), fut = d > today, r = state.days[k];
      var cls = "mc" + (fut ? " fut" : "") + (r && r.crossed ? " has" : "") + (lo && k >= lo && k <= hi ? " in" : "") + (lo && (k === lo || k === hi) ? " edge" : "");
      g.appendChild(h("button", { type: "button", class: cls, "data-cr": k, disabled: fut, "aria-label": longLabel(k), "aria-pressed": lo && k >= lo && k <= hi ? "true" : "false", text: String(n) }));
    }
    box.appendChild(g);
    box.appendChild(h("div", { class: "chips" }, [
      h("button", { type: "button", class: "chip", "data-chip": "7", text: "Last 7 days" }),
      h("button", { type: "button", class: "chip", "data-chip": "30", text: "Last 30 days" }),
      h("button", { type: "button", class: "chip", "data-chip": "month", text: "This month" })
    ]));
    var sum = !cr.a ? "No dates picked yet." : (cr.b && cr.b !== cr.a ? dmy(cr.a) + " to " + dmy(cr.b) + " · " + daysBetween(cr.a, cr.b) + " days" : dmy(cr.a) + " · 1 day");
    box.appendChild(h("div", { class: "sum", "aria-live": "polite", text: sum }));
    box.appendChild(h("button", { type: "button", class: "btn primary", id: p + "Dl", text: "Download custom Excel report" }));
    box.appendChild(h("p", { class: "hint", id: p + "Msg", "aria-live": "polite", text: state.flash || (state.dl ? "Dots on the calendar mark submitted days." : dlHint()) }));
    var eb = enableBtn(p + "Enable"); if (eb) box.appendChild(eb);
    return box;
  }
  function renderSide() {
    var side = $("side"); side.textContent = "";
    side.appendChild(h("h2", { text: "Custom report" }));
    side.appendChild(buildPicker("cr"));
  }
  function refreshRange() { renderSide(); if (state.menuOpen && state.menuView === "custom") renderMenu(); }
  function handleRangeClick(t) {
    var cr = state.cr;
    if (t.getAttribute("data-cr")) {
      var k = t.getAttribute("data-cr");
      if (!cr.a || (cr.a && cr.b)) { cr.a = k; cr.b = null; }
      else if (k < cr.a) { cr.b = cr.a; cr.a = k; }
      else cr.b = k;
      refreshRange(); return true;
    }
    if (t.getAttribute("data-crnav")) {
      cr.month = new Date(cr.month.getFullYear(), cr.month.getMonth() + (+t.getAttribute("data-crnav")), 1);
      refreshRange(); return true;
    }
    if (t.getAttribute("data-chip")) {
      var c = t.getAttribute("data-chip"), a;
      if (c === "month") a = keyOf(new Date(today.getFullYear(), today.getMonth(), 1));
      else { var d = new Date(today); d.setDate(d.getDate() - (+c - 1)); a = keyOf(d); }
      setRange(a, todayKey); refreshRange(); return true;
    }
    if (t.id === "crDl" || t.id === "ppDl") {
      var p = t.id.slice(0, 2);
      if (!cr.a) { var mm = $(p + "Msg"); if (mm) mm.textContent = "Pick a start date on the calendar first."; }
      else startDownload("custom", p + "Msg");
      return true;
    }
    if (t.id === "crEnable" || t.id === "ppEnable") { enableDownloads(t.id.slice(0, 2) + "Msg"); return true; }
    return false;
  }
  function onRangeChange(e) {
    var id = e.target.id;
    if (id === "crFrom" || id === "ppFrom") setRange(e.target.value || null, state.cr.b);
    else if (id === "crTo" || id === "ppTo") setRange(state.cr.a, e.target.value || null);
    else return;
    refreshRange();
  }

  /* ---------- editor ---------- */
  function radioGroup(name, legend, opts, cur) {
    var seg = h("div", { class: "seg" });
    Object.keys(opts).forEach(function (v) {
      var id = name + "-" + v;
      seg.appendChild(h("label", { for: id }, [h("input", { type: "radio", name: name, id: id, value: v, checked: cur === v }), h("span", { text: opts[v] })]));
    });
    return h("fieldset", null, [h("legend", { text: legend }), seg]);
  }
  function readForm() {
    if (!$("missed")) return null;
    var w = document.querySelector('input[name="work"]:checked');
    var j = document.querySelector('input[name="junk"]:checked');
    var texts = {};
    state.cats.forEach(function (c) { var t = $("cat-" + c.id); if (t) texts[c.id] = t.value; });
    return { work: w ? w.value : "", junk: j ? j.value : "", missed: $("missed").value, junkWhat: $("junkWhat").value, quick: $("quick").value, texts: texts };
  }
  function syncNames() {
    if (!state.manage) return;
    state.cats.forEach(function (c) {
      var inp = $("catname-" + c.id);
      if (inp) { var v = inp.value.trim(); c.name = (v || c.name || "Untitled").slice(0, 40); }
    });
  }
  function applyQ() {
    var m = state.qMode, ta = $("quick"), box = $("quickBox"), a = $("qMin"), b = $("qMax");
    if (!ta || !box || !a || !b) return;
    box.hidden = m === "min";
    ta.classList.toggle("max", m === "max");
    a.textContent = m === "min" ? "Expand" + (ta.value.trim() ? " \u00B7 has notes" : "") : "Minimise";
    b.textContent = m === "max" ? "Restore" : "Maximise";
    b.hidden = m === "min";
    a.setAttribute("aria-expanded", m === "min" ? "false" : "true");
    b.setAttribute("aria-pressed", m === "max" ? "true" : "false");
  }
  function renderEditor(draft) {
    var k = state.sel, rec = state.days[k] || {};
    if (!draft) dirty = false;
    var v = draft || { work: rec.work || "", junk: rec.junk || "", missed: rec.missed || "", junkWhat: rec.junkWhat || "", quick: rec.quick || "", texts: itemTexts(rec) };
    var f = $("editor"); f.textContent = "";
    var head = h("div", null, [h("h2", { text: k === todayKey ? "Today" : dayLabel(k) }), h("p", { class: "when", text: longLabel(k) + (rec.crossed ? " · submitted" : "") })]);
    var work = radioGroup("work", "How did work go?", WORK, v.work);

    var cats = h("div", { class: "cats" });
    state.cats.forEach(function (c) {
      var title;
      if (state.manage) {
        var armed = state.delArm === c.id;
        title = h("div", { class: "manage" }, [
          h("input", { class: "name", id: "catname-" + c.id, type: "text", maxlength: "40", "aria-label": "Category name", value: c.name }),
          h("button", { type: "button", class: "btn small del" + (armed ? " armed" : ""), "data-del": c.id, "aria-label": "Delete " + c.name, text: armed ? "Sure?" : "Delete" })
        ]);
      } else {
        title = h("div", { class: "t", text: c.name });
      }
      var ta = h("textarea", { id: "cat-" + c.id, rows: "1", "aria-label": c.name, placeholder: "Write work done" });
      ta.value = v.texts[c.id] || "";
      var box = h("div", { class: "cat" }, [title, ta]);
      box.style.setProperty("--cc", "var(--c" + c.c + ")");
      cats.appendChild(box);
    });
    var catsHead = h("div", { class: "cats-head" }, [
      h("h3", { text: "Work done today" }),
      h("div", { class: "btns" }, [
        h("button", { type: "button", class: "btn small", id: "addCat", text: "+ Add category" }),
        h("button", { type: "button", class: "btn small", id: "manageBtn", text: state.manage ? "Done" : "Edit or delete" })
      ])
    ]);
    var catsSec = h("div", { style: "display:flex;flex-direction:column;gap:10px" }, [catsHead, cats]);
    if (!state.cats.length) cats.appendChild(h("p", { class: "hint", text: "No categories yet. Use Add category." }));
    if (state.manage) catsSec.appendChild(h("p", { class: "hint", text: "Rename a category by typing in its name. Delete asks twice. Days you already submitted keep what they had." }));

    var missed = h("div", { id: "missedBox", style: "display:flex;flex-direction:column;gap:8px" }, [
      h("label", { class: "lbl", for: "missed", text: "What did not get done, and why?" }),
      h("textarea", { id: "missed", placeholder: "e.g. Report not sent. Client call ran long." })
    ]);
    missed.querySelector("textarea").value = v.missed || "";

    var junk = radioGroup("junk", "Junk food today?", JUNK, v.junk);
    var jw = h("div", { id: "junkBox", style: "display:flex;flex-direction:column;gap:8px" }, [
      h("label", { class: "lbl", for: "junkWhat", text: "What did you eat, and how much?" }),
      h("textarea", { id: "junkWhat", placeholder: "e.g. 2 samosas at 4pm, 1 cold drink" })
    ]);
    jw.querySelector("textarea").value = v.junkWhat || "";

    var msg = h("span", { class: "msg", id: "msg", "aria-live": "polite" });
    var actions = h("div", { class: "actions" }, [
      h("button", { type: "submit", class: "btn primary", id: "crossBtn", text: rec.crossed ? "Submit changes" : "Submit and cross out day" }),
      rec.crossed ? h("button", { type: "button", class: "btn", id: "uncrossBtn", text: "Remove cross" }) : h("button", { type: "button", class: "btn", id: "draftBtn", text: "Save without crossing" }),
      msg
    ]);
    [head, work, catsSec, missed, junk, jw, actions].forEach(function (n) { f.appendChild(n); });
    syncVisibility();
    if (!draft) renderNotes();
  }
  function renderNotes() {
    var p = $("notesPanel"); if (!p) return;
    var rec = state.days[state.sel] || {};
    p.textContent = "";
    var qTa = h("textarea", { id: "quick", class: "ruled notes6", rows: "6", "aria-label": "Notes", placeholder: "Quick notes for the day..." });
    qTa.value = rec.quick || "";
    p.appendChild(h("div", { class: "qnotes" }, [
      h("div", { class: "qhead" }, [
        h("div", null, [h("h3", { text: "Notes" }), h("p", { class: "when", text: (state.sel === todayKey ? "Today, " : "") + longLabel(state.sel) })]),
        h("div", { class: "btns" }, [
          h("button", { type: "button", class: "btn small", id: "qMin", "aria-controls": "quickBox" }),
          h("button", { type: "button", class: "btn small", id: "qMax", "aria-controls": "quickBox" })
        ])
      ]),
      h("div", { id: "quickBox" }, [qTa])
    ]));
    applyQ();
  }
  function syncVisibility() {
    var w = document.querySelector('input[name="work"]:checked');
    var j = document.querySelector('input[name="junk"]:checked');
    var mb = $("missedBox"), jb = $("junkBox");
    if (mb) mb.hidden = !(w && (w.value === "partly" || w.value === "missed"));
    if (jb) jb.hidden = !(j && j.value === "had");
  }
  function collect(crossed) {
    var f = readForm(), rec0 = state.days[state.sel] || {}, items = [];
    state.cats.forEach(function (c) {
      var t = (f.texts[c.id] || "").trim();
      if (t) items.push({ id: c.id, name: c.name, c: c.c, text: t });
    });
    (rec0.items || []).forEach(function (it) {
      var key = itemKey(it);
      if (!state.cats.some(function (c) { return c.id === key; })) items.push(it);
    });
    return { work: f.work, items: items, missed: f.missed.trim(), junk: f.junk, junkWhat: f.junkWhat.trim(), notes: rec0.notes || "", quick: f.quick.trim(), crossed: crossed, updated: new Date().toISOString() };
  }
  function say(text, err) { var m = $("msg"); if (m) { m.textContent = text; m.className = "msg" + (err ? " err" : ""); } }
  async function save(crossed) {
    syncNames();
    var rec = collect(crossed), k = state.sel;
    if (crossed && (!rec.work || !rec.junk)) { say("Pick work status and junk food status first.", true); return; }
    try {
      await persist(k, rec);
      state.fresh = crossed ? k : null;
      renderAll(true);
      say(crossed ? "Submitted. Day crossed out." : "Saved.", false);
      setTimeout(function () { state.fresh = null; }, 800);
    } catch (e) {
      say(e && e.message ? e.message : "Could not save. Try again.", true);
    }
  }
  function redraw(draft) { var was = dirty; renderEditor(draft); dirty = was; }

  /* ---------- log list ---------- */
  function renderLog() {
    var y = state.month.getFullYear(), m = state.month.getMonth(), pre = y + "-" + pad(m + 1) + "-";
    $("logTitle").textContent = "Submitted days in " + MONTHS[m];
    var keys = Object.keys(state.days).filter(function (k) { return k.indexOf(pre) === 0 && state.days[k].crossed; }).sort().reverse();
    var box = $("entries"); box.textContent = "";
    if (!keys.length) { box.appendChild(h("div", { class: "empty", text: "Nothing submitted yet this month. Pick a day, write what you did and submit it." })); return; }
    keys.forEach(function (k) {
      var r = state.days[k];
      var badges = h("div", { class: "badges" }, [
        r.work ? h("span", { class: "badge " + (r.work === "done" ? "good" : r.work === "partly" ? "warn" : "bad"), text: WORK[r.work] }) : null,
        r.junk ? h("span", { class: "badge " + (r.junk === "clean" ? "good" : "junk"), text: JUNK[r.junk] }) : null
      ]);
      var body = h("div", { class: "body" }, [badges]);
      (r.items || []).forEach(function (it) {
        var p = h("p", { class: "item" }, [h("small", { text: it.name }), it.text]);
        p.style.setProperty("--cc", "var(--c" + itemColor(it) + ")");
        body.appendChild(p);
      });
      if (r.missed) { var pm = h("p", { class: "item" }, [h("small", { text: "Not done" }), r.missed]); pm.style.setProperty("--cc", "var(--bad)"); body.appendChild(pm); }
      if (r.junkWhat) { var pj = h("p", { class: "item" }, [h("small", { text: "Junk food" }), r.junkWhat]); pj.style.setProperty("--cc", "var(--junk)"); body.appendChild(pj); }
      if (r.quick) { var pq = h("p", { class: "item" }, [h("small", { text: "Notes" }), r.quick]); pq.style.setProperty("--cc", "var(--c3)"); body.appendChild(pq); }
      if (r.notes) { var pn = h("p", { class: "item" }, [h("small", { text: "Other notes" }), r.notes]); pn.style.setProperty("--cc", "var(--c4)"); body.appendChild(pn); }
      var row = h("div", { class: "entry" }, [h("div", { class: "d", text: dayLabel(k) }), body]);
      row.addEventListener("click", function () { state.sel = k; state.manage = false; renderAll(true); });
      box.appendChild(row);
    });
  }

  function renderAll(withEditor) {
    renderCalendar(); renderStats(); renderReport(); renderLog(); renderSide(); setStoreNote();
    if (withEditor) renderEditor();
  }

  /* ---------- events ---------- */
  $("grid").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-k]");
    if (!b || b.disabled) return;
    state.sel = b.getAttribute("data-k"); state.manage = false; state.delArm = null;
    renderAll(true);
  });
  $("prev").addEventListener("click", function () { state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); renderAll(false); });
  $("next").addEventListener("click", function () { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); renderAll(false); });

  $("report").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t || t.disabled) return;
    if (handleRangeClick(t)) return;
    if (t.id === "dlToggle") { setMenu(!state.menuOpen); return; }
    if (t.id === "dlEnable") { enableDownloads("dlMsg"); return; }
    if (t.getAttribute("data-dl")) { setMenu(false); startDownload(t.getAttribute("data-dl"), "dlMsg"); return; }
    if (t.getAttribute("data-custom")) { state.menuView = "custom"; renderMenu(); return; }
    if (t.getAttribute("data-back")) { state.menuView = "list"; renderMenu(); }
  });
  $("report").addEventListener("change", onRangeChange);
  document.addEventListener("click", function (e) {
    if (!state.menuOpen) return;
    var path = e.composedPath ? e.composedPath() : [];
    var inside = path.some(function (el) { return el && el.classList && el.classList.contains("dl"); });
    if (!inside) setMenu(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.menuOpen) { setMenu(false); var b = $("dlToggle"); if (b) b.focus(); }
  });

  $("side").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t || t.disabled) return;
    handleRangeClick(t);
  });
  $("side").addEventListener("change", onRangeChange);

  $("notesPanel").addEventListener("input", function (e) { dirty = true; if (e.target.id === "quick") applyQ(); });
  $("notesPanel").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "qMin") { state.qMode = state.qMode === "min" ? "normal" : "min"; applyQ(); }
    else if (t.id === "qMax") { state.qMode = state.qMode === "max" ? "normal" : "max"; applyQ(); }
  });
  $("editor").addEventListener("change", syncVisibility);
  $("editor").addEventListener("input", function () { dirty = true; });
  $("editor").addEventListener("submit", function (e) { e.preventDefault(); save(true); });
  $("editor").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    var del = t.getAttribute("data-del");
    if (del) {
      syncNames();
      var d = readForm();
      if (state.delArm !== del) { state.delArm = del; redraw(d); }
      else {
        state.cats = state.cats.filter(function (c) { return c.id !== del; });
        delete d.texts[del]; state.delArm = null;
        redraw(d); commitCats();
      }
      return;
    }
    if (t.id === "draftBtn" || t.id === "uncrossBtn") save(false);
    else if (t.id === "manageBtn") {
      syncNames(); var d2 = readForm();
      state.manage = !state.manage; state.delArm = null;
      redraw(d2);
      if (!state.manage) commitCats();
    } else if (t.id === "addCat") {
      syncNames(); var d3 = readForm();
      var nc = { id: newId(), name: "New category", c: nextColor() };
      state.cats.push(nc); state.manage = true; state.delArm = null;
      redraw(d3); commitCats();
      var inp = $("catname-" + nc.id); if (inp) { inp.focus(); inp.select(); }
    }
  });

  /* ---------- boot ---------- */
  state.days = readLocal();
  state.cats = readLocalCats() || defaultCats();
  renderAll(true);

  (async function () {
    try { state.dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { state.dl = null; }
    if (!state.dl) {
      try { state.perm = window.claude && window.claude.use ? await window.claude.use("permissions") : null; if (state.perm) state.permState = await state.perm.state("downloads"); }
      catch (e) { state.perm = null; }
    }
    state.dlChecked = true; renderReport(); renderSide();
    var db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { renderAll(false); return; }
    state.db = db;
    var first = true;
    try {
      db.collection("days").onSnapshot(function (snap) {
        var days = {};
        snap.docs.forEach(function (d) { days[d.id] = d.data(); });
        if (first) {
          first = false;
          var local = readLocal();
          Object.keys(local).forEach(function (k) { if (!days[k]) { days[k] = local[k]; db.collection("days").doc(k).set(local[k]).catch(function () {}); } });
        }
        state.days = days;
        renderAll(!dirty);
      }, function () { state.db = null; state.days = readLocal(); renderAll(false); });
      var firstCats = true;
      db.doc("settings/categories").onSnapshot(function (snap) {
        var d = snap.exists ? snap.data() : null;
        var list = d ? normCats(d.list || d.names) : null;
        if (list) {
          if (!state.manage) { state.cats = list; if (!dirty) renderEditor(); }
        } else if (firstCats) {
          var lc = readLocalCats();
          if (lc && lc.length) { state.cats = lc; commitCats(); if (!dirty) renderEditor(); }
        }
        firstCats = false;
      }, function () {});
    } catch (e) { state.db = null; renderAll(false); }
  })();
})();
</script>

</body></html>
